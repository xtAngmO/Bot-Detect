name: Release

# ต้องสร้างทั้งสองไฟล์บนเครื่องของระบบนั้นเอง — PyInstaller ข้ามระบบไม่ได้ (สร้าง .exe บน macOS ไม่ได้
# และสร้าง .app บน Windows ไม่ได้) จึงแยกเป็นสอง job แล้วค่อยเอาผลมารวมเป็น release เดียว
on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # กดรันเองจากหน้า Actions ได้ (ไว้ทดสอบว่า build ผ่านก่อนติด tag)

permissions:
  contents: write  # ต้องใช้ตอนสร้าง release

jobs:
  build:
    strategy:
      fail-fast: false  # ระบบหนึ่งพังไม่ควรทำให้อีกระบบที่ build เสร็จแล้วหายไปด้วย
      matrix:
        include:
          - os: windows-latest
            artifact: NumberSequenceBot-windows-x64
          - os: macos-latest
            artifact: NumberSequenceBot-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # ต้องมีก่อน build — ตัว spec หยิบ tesseract ของเครื่องที่ build ใส่เข้าไปในโปรแกรมเลย
      # (และเทสต์ OCR ก็ใช้ตัวนี้)
      - name: Install Tesseract (Windows)
        if: runner.os == 'Windows'
        run: choco install tesseract --no-progress -y

      - name: Install Tesseract (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract

      # QT_QPA_PLATFORM=offscreen — runner ไม่มีจอจริง
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

      - name: Build
        run: pyinstaller --noconfirm --clean NumberSequenceBot.spec

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir out
          copy dist\NumberSequenceBot.exe out\NumberSequenceBot.exe

      # ต้องใช้ ditto ไม่ใช่ zip — .app มี symlink ข้างใน ถ้า zip ธรรมดาจะพังตอนแตกไฟล์
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir out
          ditto -c -k --keepParent "dist/NumberSequenceBot.app" "out/NumberSequenceBot-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            Number Sequence Bot — plays Schulte-grid number games by itself.

            | Download | System |
            | --- | --- |
            | `NumberSequenceBot.exe` | Windows 10/11 |
            | `NumberSequenceBot-macos.zip` | macOS 12+ (Apple Silicon) |

            Both builds are unsigned. Windows SmartScreen: **More info → Run anyway**.
            macOS: right-click → **Open** the first time, or
            `xattr -dr com.apple.quarantine "NumberSequenceBot.app"`.

            **macOS also needs permissions** in System Settings → Privacy & Security:
            **Screen & System Audio Recording** (to read the grid) and **Accessibility**
            (for the Esc panic key).

            **Tesseract is bundled** — nothing extra to install for OCR. To play on a phone you
            still need scrcpy and adb; see the README.
